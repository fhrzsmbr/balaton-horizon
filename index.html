<!DOCTYPE html>
<html lang="hu"><head><meta charset="utf-8"><title>Balaton Horizon</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9cc3e6;font-family:system-ui,sans-serif}
#hud{position:fixed;left:20px;bottom:18px;color:#fff;text-shadow:0 2px 6px #000;font-size:56px;font-weight:700;font-style:italic}
#hud small{font-size:20px;margin-left:6px}#rd{font-size:16px;font-style:normal;font-weight:400;display:block}
#mm{position:fixed;right:14px;bottom:14px;border:2px solid #fff8;border-radius:10px;width:220px;background:#0008}
#help{position:fixed;left:20px;top:14px;color:#fff;text-shadow:0 1px 4px #000;font-size:13px}
#ld{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#123;color:#fff;font-size:24px}
</style></head><body>
<div id="ld">Térkép betöltése…</div>
<div id="help">W/↑ gáz · S/↓ fék/hátra · A/D kormány · Szóköz kézifék · Shift nitró · C kamera · R visszaállítás</div>
<div id="hud"><span id="sp">0</span><small>km/h</small><span id="rd"></span></div>
<canvas id="mm" width="220" height="210"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async()=>{
const [hb,D]=await Promise.all([fetch('height.bin').then(r=>r.arrayBuffer()),fetch('roads.json').then(r=>r.json())]);
const G=new Uint16Array(hb),{w:GW,h:GH,wx:WX,wz:WZ,roads:R}=D,dx=WX/(GW-1),dz=WZ/(GH-1),WL=104.6;
const gh=(i,j)=>G[Math.max(0,Math.min(GH-1,j))*GW+Math.max(0,Math.min(GW-1,i))]/100;
function hAt(x,z){const fx=x/dx,fz=z/dz,i=Math.floor(fx),j=Math.floor(fz),u=fx-i,v=fz-j;
 return (gh(i,j)*(1-u)+gh(i+1,j)*u)*(1-v)+(gh(i,j+1)*(1-u)+gh(i+1,j+1)*u)*v}
// úttípusok: szélesség, szín, tapadás
const TY=[[9,0x3b3b40,1],[6,0x3b3b40,1],[7.5,0x434347,1],[6,0x434347,1],[6.5,0x4a4a4e,1],[5,0x4a4a4e,1],[5.5,0x55555a,1],[5,0x5c5c60,1],[4.5,0x6a6a6a,.95],[4,0x6e6e70,.9],[3.6,0x8d6f48,.75],[10,0x2c2c30,1.1]];
const sc=new THREE.Scene(),sky=new THREE.Color(0x9cc3e6);sc.background=sky;sc.fog=new THREE.Fog(sky,1500,9000);
const rn=new THREE.WebGLRenderer({antialias:true});rn.setPixelRatio(Math.min(devicePixelRatio,2));rn.setSize(innerWidth,innerHeight);document.body.appendChild(rn.domElement);
const cam=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.5,16000);
sc.add(new THREE.HemisphereLight(0xdfeeff,0x556633,.9));const sun=new THREE.DirectionalLight(0xfff0d0,1.1);sun.position.set(-1,1.4,.6);sc.add(sun);
// terep
const P=new Float32Array(GW*GH*3),C=new Float32Array(GW*GH*3),I=new Uint32Array((GW-1)*(GH-1)*6);
for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){const k=(j*GW+i)*3;P[k]=i*dx;P[k+1]=gh(i,j);P[k+2]=j*dz}
let q=0;for(let j=0;j<GH-1;j++)for(let i=0;i<GW-1;i++){const a=j*GW+i,b=a+1,c=a+GW,d=c+1;I.set([a,c,b,b,c,d],q);q+=6}
const tg=new THREE.BufferGeometry();tg.setAttribute('position',new THREE.BufferAttribute(P,3));tg.setIndex(new THREE.BufferAttribute(I,1));tg.computeVertexNormals();
const N=tg.attributes.normal.array,col=new THREE.Color();
for(let n=0;n<GW*GH;n++){const h=P[n*3+1],s=1-N[n*3+1];
 if(h<WL+1.2)col.setRGB(.78,.72,.52);else if(s>.16||h>340)col.setRGB(.5,.47,.42);
 else col.setHSL(.27-Math.min(h-105,220)/220*.07,.38,.34+(Math.sin(n*12.9898)*.02));
 C.set([col.r,col.g,col.b],n*3)}
tg.setAttribute('color',new THREE.BufferAttribute(C,3));
sc.add(new THREE.Mesh(tg,new THREE.MeshLambertMaterial({vertexColors:true})));
const wt=new THREE.Mesh(new THREE.PlaneGeometry(WX*1.5,WZ*1.5),new THREE.MeshLambertMaterial({color:0x2f78b5,transparent:true,opacity:.85}));
wt.rotation.x=-Math.PI/2;wt.position.set(WX/2,WL,WZ/2);sc.add(wt);
// utak + térbeli hash
const pos=[],cl=[],ix=[],HS=120,hash=new Map();
function addSeg(x1,z1,x2,z2,t){const x0=Math.min(x1,x2)-12,x9=Math.max(x1,x2)+12,z0=Math.min(z1,z2)-12,z9=Math.max(z1,z2)+12;
 for(let a=Math.floor(x0/HS);a<=Math.floor(x9/HS);a++)for(let b=Math.floor(z0/HS);b<=Math.floor(z9/HS);b++){const k=a+','+b;let L=hash.get(k);if(!L)hash.set(k,L=[]);L.push([x1,z1,x2,z2,t])}}
for(const [t,br,c] of R){const [w,hex,]=TY[t],cc=new THREE.Color(hex),pts=[];
 for(let n=0;n<c.length;n+=2){const x=c[n],z=c[n+1];if(n){const p=pts[pts.length-1],L=Math.hypot(x-p[0],z-p[1]),m=Math.ceil(L/8);for(let s=1;s<m;s++)pts.push([p[0]+(x-p[0])*s/m,p[1]+(z-p[1])*s/m])}pts.push([x,z])}
 const h0=hAt(pts[0][0],pts[0][1]),h1=hAt(pts.at(-1)[0],pts.at(-1)[1]),base=pos.length/3;
 for(let n=0;n<pts.length;n++){const a=pts[Math.max(0,n-1)],b=pts[Math.min(pts.length-1,n+1)];let tx=b[0]-a[0],tz=b[1]-a[1];const l=Math.hypot(tx,tz)||1;tx/=l;tz/=l;
  const [x,z]=pts[n],y=(br?h0+(h1-h0)*n/(pts.length-1):hAt(x,z))+.45;
  pos.push(x-tz*w/2,y,z+tx*w/2,x+tz*w/2,y,z-tx*w/2);cl.push(cc.r,cc.g,cc.b,cc.r,cc.g,cc.b);
  if(n){const o=base+n*2;ix.push(o-2,o,o-1,o-1,o,o+1);addSeg(pts[n-1][0],pts[n-1][1],x,z,t)}}}
const rg=new THREE.BufferGeometry();rg.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));rg.setAttribute('color',new THREE.Float32BufferAttribute(cl,3));rg.setIndex(ix);rg.computeVertexNormals();
sc.add(new THREE.Mesh(rg,new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2})));
function roadAt(x,z){let best=null,bd=1e9;for(let a=-0;a<1;a++){const L=hash.get(Math.floor(x/HS)+','+Math.floor(z/HS));if(!L)return null;
 for(const [x1,z1,x2,z2,t] of L){const ex=x2-x1,ez=z2-z1,u=Math.max(0,Math.min(1,((x-x1)*ex+(z-z1)*ez)/(ex*ex+ez*ez||1))),d=Math.hypot(x-x1-ex*u,z-z1-ez*u);if(d<TY[t][0]/2+.8&&d<bd){bd=d;best=t}}}return best}
// autó
const car=new THREE.Group(),bm=new THREE.MeshLambertMaterial({color:0xe8401c});
const body=new THREE.Mesh(new THREE.BoxGeometry(1.9,.55,4.3),bm);body.position.y=.65;const cab=new THREE.Mesh(new THREE.BoxGeometry(1.6,.5,2),new THREE.MeshLambertMaterial({color:0x222a33}));cab.position.set(0,1.15,-.2);car.add(body,cab);
for(const [a,b] of [[-1,1.4],[1,1.4],[-1,-1.4],[1,-1.4]]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.3,12),new THREE.MeshLambertMaterial({color:0x111111}));w.rotation.z=Math.PI/2;w.position.set(a*.95,.38,b);car.add(w)}
sc.add(car);
const S={x:0,z:0,yaw:0,vx:0,vz:0,py:0,pitch:0,roll:0};let camMode=0;
function reset(){let b=R.find(r=>r[0]==0)||R[0];const c=b[2],m=c.length/4|0&~1;S.x=c[m*2];S.z=c[m*2+1];S.yaw=Math.atan2(c[m*2+2]-S.x,c[m*2+3]-S.z);S.vx=S.vz=0}
reset();
const K={};addEventListener('keydown',e=>{K[e.code]=1;if(e.code=='KeyR')reset();if(e.code=='KeyC')camMode=(camMode+1)%2;if(e.code=='Space')e.preventDefault()});addEventListener('keyup',e=>K[e.code]=0);
addEventListener('resize',()=>{rn.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
// minimap
const mm=document.getElementById('mm'),mc=mm.getContext('2d'),bg=document.createElement('canvas');bg.width=220;bg.height=210;const bc=bg.getContext('2d');
bc.fillStyle='#2a4a35';bc.fillRect(0,0,220,210);bc.strokeStyle='#fff';bc.lineWidth=.6;
for(const [t,,c] of R){if(t>4)continue;bc.beginPath();for(let n=0;n<c.length;n+=2){const X=c[n]/WX*220,Y=c[n+1]/WZ*210;n?bc.lineTo(X,Y):bc.moveTo(X,Y)}bc.stroke()}
const sp=document.getElementById('sp'),rd=document.getElementById('rd'),NAME=['Főút','Főút','Másodrendű út','Másodrendű út','Összekötő út','Összekötő út','Mellékút','Lakóutca','Lakó-pihenő övezet','Kiszolgáló út','Földút','Versenypálya'];
document.getElementById('ld').remove();
let last=performance.now(),nitro=1;
function step(now){requestAnimationFrame(step);const dt=Math.min((now-last)/1000,.05);last=now;
 const th=K.KeyW||K.ArrowUp,br=K.KeyS||K.ArrowDown,st=((K.KeyA||K.ArrowLeft)?1:0)-((K.KeyD||K.ArrowRight)?1:0),hb=K.Space,nt=(K.ShiftLeft||K.ShiftRight)&&nitro>0;
 nitro=Math.max(0,Math.min(1,nitro+(nt?-.25:.1)*dt));
 const fx=Math.sin(S.yaw),fz=Math.cos(S.yaw),rx=Math.cos(S.yaw),rz=-Math.sin(S.yaw);
 let vF=S.vx*fx+S.vz*fz,vL=S.vx*rx+S.vz*rz;
 const rt=roadAt(S.x,S.z),on=rt!==null,gr=on?TY[rt][2]:.5,hh=hAt(S.x,S.z),vmax=(on?62:30)*(nt?1.3:1);
 if(th)vF+=(nt?26:16)*(1-Math.max(0,vF)/vmax)*dt;
 if(br){vF-=(vF>1?32:10)*dt}
 vF-=Math.sign(vF)*Math.min(Math.abs(vF),(on?.8:4)*dt);vF-=vF*.0006*Math.abs(vF)*dt*10;
 vL*=Math.exp(-(hb?1.2:7)*gr*dt);
 if(hh<WL+.2&&!on){vF*=Math.exp(-1.2*dt)}
 const yr=st*1.9*Math.max(-1,Math.min(1,vF/7))/(1+Math.abs(vF)/32)*(hb?1.5:1);S.yaw+=yr*dt;
 const nfx=Math.sin(S.yaw),nfz=Math.cos(S.yaw),nrx=Math.cos(S.yaw),nrz=-Math.sin(S.yaw);
 S.vx=nfx*vF+nrx*vL;S.vz=nfz*vF+nrz*vL;
 const gx=(hAt(S.x+3,S.z)-hAt(S.x-3,S.z))/6,gz=(hAt(S.x,S.z+3)-hAt(S.x,S.z-3))/6;S.vx-=gx*9*dt;S.vz-=gz*9*dt;
 S.x=Math.max(5,Math.min(WX-5,S.x+S.vx*dt));S.z=Math.max(5,Math.min(WZ-5,S.z+S.vz*dt));
 const g=Math.max(hAt(S.x,S.z),WL-.3)+(on?.45:0),hf=hAt(S.x+nfx*2,S.z+nfz*2),hbk=hAt(S.x-nfx*2,S.z-nfz*2),hl=hAt(S.x-nrx*1,S.z-nrz*1),hr=hAt(S.x+nrx*1,S.z+nrz*1);
 S.py+=(g-S.py)*Math.min(1,dt*15);S.pitch+=(Math.atan2(hbk-hf,4)-S.pitch)*Math.min(1,dt*8);S.roll+=(Math.atan2(hl-hr,2)-S.roll)*Math.min(1,dt*8);
 car.position.set(S.x,S.py,S.z);car.rotation.set(0,0,0);car.rotation.y=S.yaw;car.rotateX(S.pitch);car.rotateZ(S.roll);
 const spd=Math.hypot(S.vx,S.vz),ang=spd>3?Math.atan2(S.vx,S.vz):S.yaw;let ca=S.yaw;ca+=(Math.atan2(Math.sin(ang-S.yaw),Math.cos(ang-S.yaw)))*.4;
 const dist=camMode?.1:9+spd*.03,hgt=camMode?1.3:3.4+spd*.01,tx=S.x-Math.sin(ca)*dist,tz=S.z-Math.cos(ca)*dist;
 cam.position.set(tx,Math.max(S.py+hgt,hAt(tx,tz)+1.5),tz);cam.lookAt(S.x+Math.sin(S.yaw)*(camMode?20:6),S.py+(camMode?1.2:1.3),S.z+Math.cos(S.yaw)*(camMode?20:6));
 cam.fov=65+Math.min(spd,70)*.3+(nt?8:0);cam.updateProjectionMatrix();
 sp.textContent=Math.round(spd*3.6);rd.textContent=(on?NAME[rt]:hh<WL+.2?'Balaton':'Terep')+' · nitró '+Math.round(nitro*100)+'%';
 mc.drawImage(bg,0,0);mc.fillStyle='#ff3';mc.beginPath();mc.arc(S.x/WX*220,S.z/WZ*210,4,0,7);mc.fill();
 rn.render(sc,cam)}
requestAnimationFrame(step);
})();
</script></body></html>
